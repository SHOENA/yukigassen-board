<head>
<meta charset="utf-8">

<link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">

<title>作戦共有用アプリ｜大会予定</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&family=Roboto+Mono:wght@500&display=swap">
<link rel="stylesheet" href="css/style.css?v=37">
<script type="module" src="js/tournaments.js?v=37"></script>
</head>
<body data-page="events">
<div class="wrap">
  <header>
    <div class="topbar">
      <a class="back" href="index.html" aria-label="メニューに戻る"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6 8.5 12l6 6"/></svg>メニュー</a>
      <span class="appname">作戦共有用アプリ</span>
    </div>
    <h1>シーズン大会予定</h1>
    <p class="sub">大会ごとに、参加予定のメンバーをメモできます。名前を押して参加・未定・不参加を切り替えられます。</p>
  </header>

  <div class="panel h2row">
    <span class="h2like">大会一覧</span>
    <span class="spacer"></span>
    <button id="refreshBtn" class="ghost" hidden>最新を読み込む</button>
  </div>
  <div class="bar tight" id="shareStatus" hidden></div>

  <div class="events" id="eventList"></div>
  <p class="empty" id="eventEmpty">まだ大会がありません。下のフォームから追加してください。</p>

  <section class="panel">
    <h2>大会を追加</h2>
    <div class="row">
      <input id="evName" type="text" maxlength="40" autocomplete="off" placeholder="大会名（例：北海道オープン）" aria-label="大会名">
    </div>
    <div class="row tightrow rule-row2">
      <input id="evDate" type="date" aria-label="開催日">
      <input id="evPlace" type="text" maxlength="30" autocomplete="off" placeholder="場所（任意）" aria-label="場所">
    </div>
    <div class="row tightrow">
      <input id="evMemo" type="text" maxlength="100" autocomplete="off" placeholder="メモ（任意：集合時間・参加費など）" aria-label="メモ">
    </div>
    <div class="toolbar tight">
      <button id="evAddBtn" class="primary wide">追加</button>
    </div>
    <p class="empty">追加した大会はチーム全員の画面に並びます。開催日の近い順に表示され、終わった大会は下にまとまります。</p>
  </section>
</div>
<nav class="tabbar" aria-label="ページ切り替え">

  <a href="formation.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="1.5"/><path d="M12 6v12"/><circle cx="7" cy="10" r=".9" fill="currentColor"/><circle cx="7" cy="14.5" r=".9" fill="currentColor"/><circle cx="16.5" cy="12" r=".9" fill="currentColor"/></svg><span>フォーメーション</span></a>
  <a href="rules.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M8.5 9h7M8.5 13h7M8.5 17h4"/></svg><span>決め事</span></a>
  <a href="tournaments.html" class="on" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14" rx="2"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg><span>大会予定</span></a>
</nav>
</body>
</html>
